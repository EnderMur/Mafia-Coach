[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-coach"
version = "0.1.0"
description = "Локальный ассистент-тренер для игры в мафию в Telegram (userbot + LM Studio)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "telethon",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "jinja2",
    "loguru",
    "tenacity",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff==0.17.3",
    "mypy",
    "pre-commit",
    "types-PyYAML",
]
training = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "*.jinja"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = [
    ".venv",
    "data",
    "logs",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.coverage.run]
source = ["domain", "infra", "features"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*", "domain*", "infra*", "features*"]
