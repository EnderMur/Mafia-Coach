# Паттерны этого клуба (плоская схема, вариант A).
# Поля каждого паттерна строго соответствуют domain/club_patterns.py::ClubPattern:
#   id, trigger, conclusion_role, confidence_tier, requires_confirmation, description.
# Допустимые тиры уверенности: CONFIDENCE_TIERS = {0.9, 0.8, 0.6}.
# Лишние поля (name/class/confidence/priority/conclusion/conflict_policy/...)
# схемой запрещены (extra="forbid").

patterns:
  - id: "#1"
    trigger: "user_1 заявил проверку: 'user_2 — Дон', и после голосования user_2 действительно изгнан с ролью Дон"
    conclusion_role: "Комиссар Каттани"
    confidence_tier: 0.8
    requires_confirmation: true
    description: "Проверка Дона, подтверждённая голосованием"

  - id: "#2"
    trigger: "user_1 в первые дни написал, что он мирный житель, или прислал сообщение бота: 'Твоя роль - 👨🏼 Мирный Житель'"
    conclusion_role: "Мирный житель"
    confidence_tier: 0.9
    requires_confirmation: false
    description: "Заявление о мирной роли"

  - id: "#3"
    trigger: "user_1 ранее заявлял, что он мирный житель, и голосует против открытого подтверждённого комиссара"
    conclusion_role: "НЕ Мирный житель (Мафия или Нейтральная роль)"
    confidence_tier: 0.6
    requires_confirmation: false
    description: "Голос против подтверждённого комиссара"

  - id: "#4"
    trigger: "user_1 заявил проверку: 'user_2 — Дон', но после голосования user_2 изгнан с другой ролью"
    conclusion_role: "Мафия или Нейтральная роль"
    confidence_tier: 0.6
    requires_confirmation: true
    description: "Ложная проверка на Дона"

  - id: "#5"
    trigger: "user_1 прислал сообщение бота: 'Ночью ты пришёл за бутылкой к ныне покойному user_2 и увидел там user_3 - 🤵🏻 Дон', и после голосования user_3 действительно изгнан Доном"
    conclusion_role: "Бомж"
    confidence_tier: 0.8
    requires_confirmation: true
    description: "Проверка Бомжа, подтверждённая голосованием"

  - id: "#6"
    trigger: "после сообщения бота '💫 Счастливчику ночью повезло, и он остался в живых!' user_1 написал что-то вроде 'Моя защита, это я' или иное self-attribution"
    conclusion_role: "Счастливчик"
    confidence_tier: 0.8
    requires_confirmation: false
    description: "Ответ на сообщение о выживании Счастливчика"

  - id: "#7"
    trigger: "user_1 написал 'сч'/'СЧ' или прислал сообщение бота: 'Твоя роль - 🤞🏼 Счастливчик'"
    conclusion_role: "Счастливчик"
    confidence_tier: 0.9
    requires_confirmation: false
    description: "Заявление Счастливчика"

  - id: "#8"
    trigger: "сообщение бота: 'Кто-то из жителей слышал, как <убитый> кричал перед смертью: <user> - <роль>' (завещание убитого Комиссара Каттани или Сержанта). Информация 100% достоверна, роль берётся из текста сообщения"
    conclusion_role: "<роль из сообщения бота>"
    # Отклонение от Приложения 1: эталон указывал 1.0, но ClubPattern
    # допускает только CONFIDENCE_TIERS = {0.9, 0.8, 0.6}. 0.9 — максимальный
    # разрешённый тир; схему не расширяем (вариант B — отдельная задача).
    confidence_tier: 0.9
    requires_confirmation: false
    description: "Завещание убитого Комиссара / Сержанта (бот-факт)"
