# Паттерны этого клуба (плоская схема, вариант A).
# Поля каждого паттерна строго соответствуют domain/club_patterns.py::ClubPattern:
#   id, trigger, conclusion_role, confidence_tier, requires_confirmation, description.
# Допустимые тиры уверенности: CONFIDENCE_TIERS = {0.9, 0.8, 0.6}.
# Лишние поля (name/class/confidence/priority/conclusion/conflict_policy/...)
# схемой запрещены (extra="forbid").

patterns:
  - id: "#1"
    trigger: "user_1 заявил проверку: 'user_2 — Дон', и после голосования user_2 действительно изгнан с ролью Дон"
    conclusion_role: "Комиссар Каттани"
    confidence_tier: 0.8
    requires_confirmation: true
    description: "Проверка Дона, подтверждённая голосованием"
